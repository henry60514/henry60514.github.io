    if(step===2&&!s.summary)return false;

    if(step===3&&!compare(s))return false;

    s.step=step;return true;
  }
  const api={titles,create,invalidateOutput,answer,generate,edit,accept,confirmed,confirm,compare,clues,candidate,record,ready,confirmOutput,outputConfirmed,navigate};
  root.CoachState=api;
  if(typeof module!=='undefined')module.exports=api;
})(globalThis);

  <script>
document.addEventListener('DOMContentLoaded', function () {

function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function button(text,fn,kind='primary'){const b=el('button',text,kind);b.type='button';b.addEventListener('click',fn);return b;}

function render(){

function home(){
  const hero=el('section',undefined,'hero'),copy=el('div',undefined,'hero-copy');

  const grid=el('div',undefined,'journey-grid');[['01 /','回望一段經驗','從生活的小事，看見讓你投入的時刻。'],['02 /','整理自己的線索','修正與確認摘要，你最了解你自己。'],['03 /','看看可能的方向','比較路徑，留下你的理由或暫時未定。']].forEach(([icon,title,text])=>{const c=el('article',undefined,'journey-card');c.append(el('span',icon,'icon'),el('h3',title),el('p',text));grid.append(c);});view.append(grid);

}
function experience(){
  heading('STEP 01 / REFLECT','從一段經驗，慢慢說起。','不需要厲害的成就。一次社團活動、一份作業，或你花時間做的小事都可以；不知道也能略過。');

  const hints=['最近有什麼事情讓你投入，甚至忘記時間？','那時你實際做了什麼？遇到困難時怎麼回應？','這段經驗中，你最在意什麼？有什麼想繼續嘗試？'];
  S.titles.forEach((title,i)=>{const q=el('div',undefined,'question'),head=el('div',undefined,'question-head'),l=el('label',`${i+1}. ${title}`);l.htmlFor=`answer-${i}`;head.append(l,button('略過',()=>{S.answer(session,i,'');render();document.querySelector(`#answer-${i}`).focus();say(`已略過「${title}」，你仍可繼續。`);},'text-button'));const t=el('textarea');t.id=`answer-${i}`;t.value=session.answers[i];t.placeholder=i===0?'例如：我幫社團做海報，反覆調整配色。':'寫下你的經驗，或先留白。';t.addEventListener('input',()=>S.answer(session,i,t.value));q.append(head,el('p',hints[i],'hint'),t);card.append(q);});

  if(testMode){const tools=el('div',undefined,'test-tools');tools.append(el('p','測試工具（只在 test=1 顯示）'),button('下次整理模擬失敗',()=>{session.failNext=true;say('已設定下次整理失敗，重試會恢復成功。');},'secondary'));card.append(tools);}
  view.append(card);

function summary(){
  heading('STEP 02 / UNDERSTAND','這些線索，像你嗎？','你可以修改內容，也可以取消採用不符合自己的線索。確認只是確認這份描述，不代表能力或適配度已獲證實。');
  view.append(el('p','規則式模擬，非真實 AI · 推論尚待你確認','note'));
  const status=el('p',S.confirmed(session)?'摘要已確認':'摘要待確認','status');view.append(status);
  if(!session.summary.facts.length)view.append(el('p','資料不足：目前沒有具體經驗，沒有產生模擬推論。你仍可確認並查看一般示範比較。','card tint'));
  [['學生自述',session.summary.facts],['模擬推論 · 尚未驗證',session.summary.hypotheses]].forEach(([title,list])=>{
    const card=el('section',undefined,'card');card.append(el('h2',title));
    if(!list.length)card.append(el('p','目前沒有內容。','subtle'));
    list.forEach(c=>{const row=el('div',undefined,'clue'+(!c.accepted?' rejected':'')),label=el('label',`${S.titles[c.source]}・${c.type}`),t=el('textarea');t.id=c.id;label.htmlFor=c.id;t.value=c.text;
      t.addEventListener('input',()=>{S.edit(session,c.id,t.value);status.textContent='摘要待確認';say('內容已修改，請重新確認摘要。既有候選需重看。');if(c.type==='自述')view.querySelectorAll(`[data-source="${c.source}"][data-inference]`).forEach(n=>n.remove());});
      const checkLabel=el('label',undefined,'check-line'),check=el('input');check.type='checkbox';check.checked=c.accepted;check.setAttribute('aria-label',`採用 ${S.titles[c.source]} ${c.type}`);check.addEventListener('change',()=>{S.accept(session,c.id,check.checked);say('線索已更新，舊比較及成果已失效。');render();const target=view.querySelector(`#${c.id}`);if(target)target.focus();});checkLabel.append(check,document.createTextNode('採用這條線索（取消勾選表示否定）'));row.append(label,t,checkLabel,el('p',`來源：${S.titles[c.source]}；${c.type==='自述'?'由學生提供，可修正':'依自述產生的探索假設，尚未驗證'}`,'source-note'));row.dataset.source=c.source;if(c.type==='模擬推論')row.dataset.inference='true';card.append(row);});view.append(card);
  });
  actions(view,[button('返回經驗',()=>go(1),'secondary'),button('確認摘要',()=>{S.confirm(session);say('摘要已確認，接著看看不同路徑。');render();}),button('比較路徑',()=>go(3),'secondary')]);
}
function comparisonTable(parent){
  const scroll=el('div',undefined,'compare-scroll');scroll.tabIndex=0;scroll.setAttribute('role','region');scroll.setAttribute('aria-label','示範路徑比較，可橫向捲動');const table=el('table',undefined,'compare-table'),caption=el('caption','示範路徑尚未核定，非升學建議');caption.className='subtle';table.append(caption);
  const thead=el('thead'),hr=el('tr');['比較項目',...COACH_PATHS.map(p=>p.major)].forEach(name=>{const th=el('th',name);th.scope='col';hr.append(th);});thead.append(hr);table.append(thead);
  const body=el('tbody');[['相關職業','career'],['學習內容','learning'],['可以先試試','activity'],['路徑差異','difference'],['不確定性','uncertainties']].forEach(([label,key])=>{const tr=el('tr');tr.append(el('td',label));COACH_PATHS.forEach(p=>tr.append(el('td',p[key])));body.append(tr);});
  const sourceRow=el('tr');sourceRow.append(el('td','來源與查核'));COACH_PATHS.forEach(p=>{const td=el('td'),dl=el('dl');[['來源名稱',p.sourceName||'未提供（示範內容）'],['來源網址',p.sourceUrl||'未提供'],['查核日期',p.checkedAt||'未查核'],['查核責任角色',p.reviewer||'未提供']].forEach(([k,v])=>dl.append(el('dt',k),el('dd',v)));td.append(dl);sourceRow.append(td);});body.append(sourceRow);table.append(body);scroll.append(table);parent.append(scroll);
}
function comparison(){
  heading('STEP 03 / EXPLORE','多看一點可能，再決定。','這裡沒有「最適合」的排名。先比較兩種方向，留意差異，再想想還有哪些問題值得查證。');
  view.append(el('p','示範資料尚未核定 · 非升學建議 · 不包含完整入學條件、學費與地點','note'));

  const clues=S.clues(session);if(!clues.length)card.append(el('p','沒有足夠的個人線索，以下只提供一般示範比較。'));
  else{const ul=el('ul',undefined,'line-list');clues.forEach(c=>ul.append(el('li',`${c.type}：${c.text}`)));card.append(ul);}
  card.append(el('p','個人線索與路徑資料分開呈現，不推定適合程度。','subtle'));view.append(card);comparisonTable(view);
  const questionsArea=el('section',undefined,'card');
  const questions=field(questionsArea,'待查問題',session.questions,value=>{session.questions=value;S.invalidateOutput(session);},{id:'questions',placeholder:'寫下你想進一步查證的問題，可先留白。'});
  const examples=el('ol',undefined,'line-list');examples.id='questions-examples';
  ['和師長討論前，可以準備哪些學習表現或成績資訊？','可以進一步查證哪些學校或科系資訊？','可以採取哪些下一步探索行動，例如詢問師長、參加體驗活動或了解補習等資源？'].forEach(text=>examples.append(el('li',text)));
  const guidance=el('p','請查核官方來源及重要資訊。你可以帶著問題與師長討論，或自行選用 ChatGPT、Gemini 等外部 AI 協助整理；本產品不串接外部 AI，也不代為呼叫或傳送學生資料。請避免向外部服務提供姓名、學校、完整成績單等可識別或敏感個資。','note');guidance.id='questions-guidance';
  questions.setAttribute('aria-describedby','questions-examples questions-guidance');
  questionsArea.append(examples,guidance,el('p','未來付費版構想（尚未推出，內容與時間未定）：真人服務（職涯導師諮詢、學長姐經驗分享）；完整探索工具（多次探索與歷程整理、有來源的學校／科系比較、個人化行動計畫）。','subtle'));
  view.append(questionsArea);
  actions(view,[button('返回摘要',()=>go(2),'secondary'),button('保存待查問題',()=>say('待查問題已保留於本次探索，尚未查核。'),'secondary')]);

}
function candidateForm(parent){
  const card=el('section',undefined,'card');card.append(el('p','YOUR NEXT POSSIBILITY','eyebrow'),el('h2','把選擇權，留給自己。'),el('p','候選與理由由你來寫。只有「有興趣」也沒關係，可以先保留未定。','subtle'));
  const fs=el('fieldset');fs.style.border='0';fs.style.padding='0';fs.style.margin='0';fs.append(el('legend','目前的候選狀態'));
  [['candidate','記錄候選','寫下候選科系，與你自己的經驗有什麼關聯。'],['undecided','尚未形成候選','還需要一些探索，可以先帶著問題繼續。']].forEach(([value,title,desc])=>{const label=el('label',undefined,'radio-card'),radio=el('input');radio.type='radio';radio.name='mode';radio.value=value;radio.checked=session.candidate.mode===value;radio.addEventListener('change',()=>{S.candidate(session,'mode',value);render();document.querySelector(`input[value="${value}"]`).focus();});const text=el('span');text.append(el('strong',title),el('small',desc));label.append(radio,text);fs.append(label);});card.append(fs);
  if(session.candidate.mode==='candidate'){
    field(card,'候選科系',session.candidate.major,value=>S.candidate(session,'major',value),{id:'major',rows:1,placeholder:'由你自行填寫，不會自動選擇'});
    field(card,'我的理由',session.candidate.reason,value=>S.candidate(session,'reason',value),{id:'reason',placeholder:'哪一段自己的經驗，讓你想進一步探索這個方向？'});

  actions(card,[button('記錄並預覽討論輸出',()=>{if(!S.record(session)){error.hidden=false;error.textContent='請填寫候選科系及我的理由，或選擇「尚未形成候選」。';const first=!session.candidate.major.trim()?'major':'reason';const f=document.getElementById(first);if(f){f.setAttribute('aria-invalid','true');f.setAttribute('aria-describedby','candidate-error');error.id='candidate-error';f.focus();}return;}go(4);})]);parent.append(card);

function report(parent){
  const report=el('article',undefined,'card');report.id='report';
  report.append(el('p','MY EXPLORATION / 討論用摘要','eyebrow'),el('h2','我的探索，走到這裡。','output-heading'),el('p','規則式模擬，非真實 AI · 示範資料尚未核定 · 非升學建議','note'));
  function section(title,text){const sec=el('section',undefined,'report-section');sec.append(el('h3',title));if(text!==undefined)sec.append(el('p',text,'pre-wrap'));report.append(sec);return sec;}
  const facts=S.clues(session).filter(c=>c.type==='自述'),hyps=S.clues(session).filter(c=>c.type==='模擬推論');
  section('01 / 已確認的學生自述',facts.length?facts.map(c=>c.text).join('\n\n'):'資料不足：沒有採用的自述。');
  section('02 / 模擬推論（尚未驗證）',hyps.length?hyps.map(c=>c.text).join('\n\n'):'沒有採用的模擬推論。');
  comparisonTable(section('03 / 路徑比較與來源'));
  const candidate=section('04 / 目前的候選與個人理由');candidate.append(el('p',session.candidate.mode==='candidate'?`候選科系：${session.candidate.major}`:'尚未形成候選','pre-wrap'));if(session.candidate.mode==='candidate')candidate.append(el('p',session.candidate.reason,'pre-wrap'));

  const state=section('確認狀態');state.append(el('p',S.outputConfirmed(session)?'討論輸出已確認':'討論輸出待確認','output-state'),el('p','完成流程不等於已證實適合科系，也不代表價值研究已通過。資料只存本次分頁，重新整理或關閉即清除；列印檔案請自行保存。','subtle'));parent.append(report);
}
function syncOutput(){
  const confirmed=S.outputConfirmed(session);document.querySelector('.output-state').textContent=confirmed?'討論輸出已確認':'討論輸出待確認';document.querySelector('#print').disabled=!confirmed;

function output(){
  heading('STEP 04 / TAKE IT WITH YOU','帶著自己的想法，繼續聊聊。','可以和老師或家長一起討論。這份摘要由你確認，暫時沒有候選也能完成。');

  const print=button('列印／另存 PDF',()=>{if(S.outputConfirmed(session))window.print();},'secondary');print.id='print';print.disabled=!S.outputConfirmed(session);

}
document.querySelector('#clear').addEventListener('click',()=>{session=S.create();say('本次探索已清除。');render();document.querySelector('#main').focus();});
const themeSelect=document.querySelector('#theme-select');
if(window.CoachTheme){themeSelect.value=window.coachTheme.preference;themeSelect.addEventListener('change',()=>window.coachTheme.set(themeSelect.value));}
render();

});
